<svg xmlns="http://www.w3.org/2000/svg" width="1610" height="840" viewBox="0 0 1610 840" font-family="Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 30px; font-weight: bold; fill: #333; }
    .head { font-size: 20px; font-weight: bold; fill: #1a1a1a; }
    .body { font-size: 17px; fill: #222; }
    .src { font-size: 14px; fill: #666; font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #111; stroke-width: 2.5; fill: none; }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1608" height="838" rx="4" fill="#fff" stroke="#888" stroke-width="2"/>
  <polygon points="1,1 1609,1 1609,40 1584,70 1,70" fill="#f3f3f3" stroke="#888" stroke-width="2"/>
  <text class="title" x="805" y="46" text-anchor="middle">PHASE-3 – FAKE AUDIO DETECTION (FAIR TEST)</text>

  <!-- 1. Input data -->
  <g transform="translate(50,110)">
    <rect width="460" height="300" fill="#fff" stroke="#d79b00" stroke-width="2"/>
    <polygon points="0,0 460,0 460,38 440,64 0,64" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
    <text class="head" x="230" y="40" text-anchor="middle">1. INPUT DATA</text>
    <g class="body">
      <circle cx="22" cy="94" r="3.5"/><text x="36" y="100">600 clips: 300 SV2TTS clones and 300 real</text>
      <text x="36" y="123">TIMIT clips of the same speakers</text>
      <circle cx="22" cy="150" r="3.5"/><text x="36" y="156">Labels: clone → 0 (fake), real → 1</text>
      <circle cx="22" cy="183" r="3.5"/><text x="36" y="189">Speaker ID kept as the group for every</text>
      <text x="36" y="212">split</text>
    </g>
    <text class="src" x="230" y="280" text-anchor="middle">fake_audio_detection_fair.ipynb</text>
  </g>

  <!-- 2. Feature extraction -->
  <g transform="translate(575,110)">
    <rect width="460" height="300" fill="#fff" stroke="#6c8ebf" stroke-width="2"/>
    <polygon points="0,0 460,0 460,38 440,64 0,64" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
    <text class="head" x="230" y="40" text-anchor="middle">2. FEATURE EXTRACTION</text>
    <g class="body">
      <circle cx="22" cy="94" r="3.5"/><text x="36" y="100">librosa features, averaged over time:</text>
      <text x="36" y="123">40 MFCC + 12 chroma + 128 mel bands</text>
      <text x="36" y="146">+ 7 spectral contrast + 6 tonnetz</text>
      <text x="36" y="169">= 193 features per clip</text>
      <circle cx="22" cy="196" r="3.5"/><text x="36" y="202">Each feature group standardised per</text>
      <text x="36" y="225">recording</text>
    </g>
    <text class="src" x="230" y="280" text-anchor="middle">functions.py</text>
  </g>

  <!-- 3. Splitting -->
  <g transform="translate(1100,110)">
    <rect width="460" height="300" fill="#fff" stroke="#b85450" stroke-width="2"/>
    <polygon points="0,0 460,0 460,38 440,64 0,64" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
    <text class="head" x="230" y="40" text-anchor="middle">3. SPEAKER-GROUPED SPLITS</text>
    <g class="body">
      <circle cx="22" cy="94" r="3.5"/><text x="36" y="100">No speaker appears in both training</text>
      <text x="36" y="123">and test data</text>
      <circle cx="22" cy="150" r="3.5"/><text x="36" y="156">Single split: 486 train / 54 val /</text>
      <text x="36" y="179">60 test clips</text>
      <circle cx="22" cy="206" r="3.5"/><text x="36" y="212">5-fold GroupKFold; 10% of training</text>
      <text x="36" y="235">speakers held out for early stopping</text>
    </g>
    <text class="src" x="230" y="280" text-anchor="middle">fake_audio_detection_fair.ipynb</text>
  </g>

  <!-- 4. Model -->
  <g transform="translate(50,500)">
    <rect width="460" height="300" fill="#fff" stroke="#6c8ebf" stroke-width="2"/>
    <polygon points="0,0 460,0 460,38 440,64 0,64" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
    <text class="head" x="230" y="40" text-anchor="middle">4. MLP CLASSIFIER</text>
    <g class="body">
      <circle cx="22" cy="94" r="3.5"/><text x="36" y="100">Input: 193-feature vector</text>
      <circle cx="22" cy="127" r="3.5"/><text x="36" y="133">Dense(50, ReLU)</text>
      <circle cx="22" cy="160" r="3.5"/><text x="36" y="166">Dense(50, ReLU)</text>
      <circle cx="22" cy="193" r="3.5"/><text x="36" y="199">Dense(1, sigmoid) → probability of real</text>
    </g>
    <text class="src" x="230" y="280" text-anchor="middle">fake_audio_detection_fair.ipynb</text>
  </g>

  <!-- 5. Training -->
  <g transform="translate(575,500)">
    <rect width="460" height="300" fill="#fff" stroke="#b85450" stroke-width="2"/>
    <polygon points="0,0 460,0 460,38 440,64 0,64" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
    <text class="head" x="230" y="40" text-anchor="middle">5. TRAINING LOOP</text>
    <g class="body">
      <circle cx="22" cy="94" r="3.5"/><text x="36" y="100">Optimizer: Adam, learning rate 1e-3</text>
      <circle cx="22" cy="127" r="3.5"/><text x="36" y="133">Loss: binary cross-entropy</text>
      <circle cx="22" cy="160" r="3.5"/><text x="36" y="166">Up to 1,000 epochs</text>
      <circle cx="22" cy="193" r="3.5"/><text x="36" y="199">Early stopping on validation loss</text>
      <text x="36" y="222">(patience 5)</text>
    </g>
    <text class="src" x="230" y="280" text-anchor="middle">fake_audio_detection_fair.ipynb</text>
  </g>

  <!-- 6. Evaluation -->
  <g transform="translate(1100,500)">
    <rect width="460" height="300" fill="#fff" stroke="#82b366" stroke-width="2"/>
    <polygon points="0,0 460,0 460,38 440,64 0,64" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
    <text class="head" x="230" y="40" text-anchor="middle">6. PERFORMANCE EVALUATION</text>
    <g class="body">
      <circle cx="22" cy="94" r="3.5"/><text x="36" y="100">Accuracy, F1 score, confusion matrix</text>
      <circle cx="22" cy="127" r="3.5"/><text x="36" y="133">5-fold CV: F1 0.967 ± 0.025</text>
      <circle cx="22" cy="160" r="3.5"/><text x="36" y="166">20 errors in 600 clips, mostly clones</text>
      <text x="36" y="189">classified as real</text>
    </g>
    <text class="src" x="230" y="280" text-anchor="middle">fake_audio_detection_fair.ipynb</text>
  </g>

  <line class="arrow" x1="512" y1="260" x2="571" y2="260" marker-end="url(#tip)"/>
  <line class="arrow" x1="1037" y1="260" x2="1096" y2="260" marker-end="url(#tip)"/>
  <path class="arrow" d="M1330,412 V455 H22 V650 H46" marker-end="url(#tip)"/>
  <line class="arrow" x1="512" y1="650" x2="571" y2="650" marker-end="url(#tip)"/>
  <line class="arrow" x1="1037" y1="650" x2="1096" y2="650" marker-end="url(#tip)"/>
</svg>
